<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    <style>@import url('https://fonts.cdnfonts.com/css/cursed-timer-ulil');</style>       
    <title>Scoreboard</title>
</head>

<body>

    <div class="main_div">

        <div class="home">
            <h1 class="home_h1">HOME</h1>

            <div class="home_0">
                <p id="actual_score">0</p>
            </div>

            <div class="home_score">
                <button class="increase11" onclick="homeScore11()">+1</button>
                <button class="increase12" onclick="homeScore12()">+2</button>
                <button class="increase13" onclick="homeScore13()">+3</button>
            </div>

        </div>



        <div class="guest">

            <h1 class="guest_h1">GUEST</h1>

            <div class="guest_0">
                <p id="actual_score1">0</p>
            </div>

            <div class="guest_score">
                <button class="increase21" onclick="homeScore21()">+1</button>
                <button class="increase22" onclick="homeScore22()">+2</button>
                <button class="increase23" onclick="homeScore23()">+3</button>
            </div>

        </div>

    </div>

    <script src="index.js"></script>

</body>
</html>
